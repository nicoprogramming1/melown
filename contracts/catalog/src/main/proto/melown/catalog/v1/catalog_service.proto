syntax = "proto3";

package melown.catalog.v1;

option java_multiple_files = true; // crea multiples clases en el generate en vez de un solo archivo
option java_package = "com.melown.catalog.v1";
option java_outer_classname = "CatalogProto";

import "google/protobuf/timestamp.proto";

service CatalogService {

  // Crea un producto en estado DRAFT. El vendedor lo publica después con PublishProduct.
  // Idempotente vía idempotency_key (ADR 0007 outbox).
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);

  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
}

// Request de creación. Wrappers siempre — permite agregar fields sin breaking change.
message CreateProductRequest {

  // UUID generado por el cliente para deduplicar reintentos. El use case rechaza
  // duplicados; ver ADR 0007 (outbox) para el detalle del dedup.
  string idempotency_key = 1;

  // UUID del vendor. El mapper del adapter lo destruye a UUID antes de pasarlo al dominio.
  string vendor_id = 2;

  // Título del producto. Invariante: 1..200 chars (validada en el dominio, ver bounded-contexts).
  string title = 3;

  string description = 4;

  ProductConditionProto product_condition = 5;

  map<string, string> specifications = 6;
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  SpecificationsProto specifications = 4;
  string vendor_id = 5;
  ProductConditionProto product_condition = 6;
  ProductStatusProto product_status = 7;
  google.protobuf.Timestamp created_at = 9;
}

message CreateProductResponse {

  // UUID del producto recién creado.
  string product_id = 1;

  // Timestamp de creación (UTC).
  // google.protobuf.Timestamp created_at = 2;
}

message SpecificationsProto {
  map<string, string> values = 1;
}

message ProductStatusProto {
  oneof kind{
    DraftedStatusProto drafted = 1;
    PublishedStatusProto published = 2;
    PausedStatusProto paused = 3;
    ArchivedStatusProto archived = 4;
  }
}

message ArchivedStatusProto {
  google.protobuf.Timestamp archived_at = 1;
  string reason = 2;
}

message PausedStatusProto {
  string paused_by = 1;
}

message PublishedStatusProto {
  google.protobuf.Timestamp published_at = 1;
}

message DraftedStatusProto {
  google.protobuf.Timestamp expiration_at = 1;
  bool isExpired = 2;
}

message ProductConditionProto {
  oneof kind{
    NewConditionProto new = 1;
    UsedConditionProto used = 2;
  }
}

message NewConditionProto {
  bool guarantee = 1;
}

message UsedConditionProto {
  ConditionGradeProto grade = 1;
  string used_description = 2;
}

enum ConditionGradeProto {
  CONDITION_GRADE_UNSPECIFIED = 0;
  CONDITION_GRADE_PERFECT = 1;
  CONDITION_GRADE_GOOD = 2;
  CONDITION_GRADE_BAD = 3;
}